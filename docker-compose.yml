version: '3.8'

services:
  cost-optimizer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-cost-optimizer-ecs-simulator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMODB_TABLE_NAME=CostOptimizerRecords
      - REPORTS_S3_BUCKET=cost-optimizer-reports-226234259454
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
