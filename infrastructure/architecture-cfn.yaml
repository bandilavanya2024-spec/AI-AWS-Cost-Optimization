AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI-Powered AWS Cloud Cost Optimization System - Full Cloud Architecture
  Implements VPC, Route 53, ALB, ECS Fargate, ECR, DynamoDB, SNS, S3, CloudWatch & QuickSight.

Parameters:
  EnvironmentName:
    Type: String
    Default: Production
    Description: Deployment environment tag (Production / Staging / Development)

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: IP range for the project VPC

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.11.0/24

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.12.0/24

  AlertNotificationEmail:
    Type: String
    Default: admin@example.com
    Description: Email address for Amazon SNS cost alerts and budget thresholds

Resources:
  # ========================================================
  # 1. NETWORKING: Virtual Private Cloud (VPC) & Subnets
  # ========================================================
  ProjectVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: CostOptimizer-VPC
        - Key: Project
          Value: AI-AWS-Cost-Optimization

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CostOptimizer-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ProjectVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CostOptimizer-PublicSubnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CostOptimizer-PublicSubnet-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: CostOptimizer-PrivateSubnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: CostOptimizer-PrivateSubnet-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProjectVPC
      Tags:
        - Key: Name
          Value: CostOptimizer-Public-RT

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ========================================================
  # 2. SECURITY GROUPS: ALB & ECS
  # ========================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP from Internet
      VpcId: !Ref ProjectVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to ECS Fargate container
      VpcId: !Ref ProjectVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # ========================================================
  # 3. ROUTE 53 & ELASTIC LOAD BALANCING (ALB)
  # ========================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cost-optimizer-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Project
          Value: AI-AWS-Cost-Optimization

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cost-optimizer-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref ProjectVPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ========================================================
  # 4. CONTAINER REGISTRY (ECR) & COMPUTE (ECS FARGATE)
  # ========================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cost-optimizer-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: CostOptimizer-Cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  # ========================================================
  # 5. STORAGE & DATABASE: DynamoDB & S3
  # ========================================================
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CostOptimizerRecords
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: record_id
          AttributeType: S
      KeySchema:
        - AttributeName: record_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: AI-AWS-Cost-Optimization

  # ========================================================
  # 6. MESSAGING & NOTIFICATIONS: Amazon SNS
  # ========================================================
  CostOptimizationAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CostOptimizationAlertsTopic
      DisplayName: AWS Cost Optimization System Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CostOptimizationAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertNotificationEmail

  # ========================================================
  # 7. MONITORING & GOVERNANCE: Amazon CloudWatch
  # ========================================================
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cost-optimizer-backend
      RetentionInDays: 30

  CostAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: HighEstimatedCostAlert
      AlarmDescription: Triggers when monthly estimated workload exceeds threshold
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 50.00
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CostOptimizationAlertsTopic

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref ProjectVPC

  ALBDNSName:
    Description: Public DNS Name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  ECRUri:
    Description: ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

  DynamoDBTableName:
    Description: DynamoDB Table Name for saving optimization history
    Value: !Ref DynamoDBTable

  SNSTopicArn:
    Description: SNS Alert Topic ARN
    Value: !Ref CostOptimizationAlertsTopic
