name: CI/CD Pipeline - AI AWS Cost Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: 'Force AWS deployment on manual trigger'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ========================================================
  # STAGE 1: Continuous Integration (CI) - Test & Quality
  # ========================================================
  test-and-validate:
    name: 🧪 Unit Tests & Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 🧪 Execute Automated Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: 📦 Verify Lambda Deployment Package
        run: |
          python -c "
          import zipfile, os
          zip_path = 'backend/lambda_deployment_package.zip'
          assert os.path.exists(zip_path), 'Lambda zip package missing'
          with zipfile.ZipFile(zip_path, 'r') as z:
              files = z.namelist()
              print('Package contents:', files)
              for req in ['lambda_function.py', 'cost_analyzer.py', 'estimator_engine.py']:
                  assert req in files, f'Missing {req} in zip'
          print('Zip package integrity verified successfully.')
          "

  # ========================================================
  # STAGE 2: Security & Static Quality Audit
  # ========================================================
  security-audit:
    name: 🛡️ Security Audit & Credentials Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Scan for Accidental Secrets / Plaintext Keys
        run: |
          echo "Scanning codebase for exposed AWS Secret Access Keys..."
          # Scan for standard AWS secret patterns: AKIA/ASIA or typical key patterns
          python -c "
          import os, re
          secret_pattern = re.compile(r'(?i)(aws_secret_access_key|access_key_id)\s*[:=]\s*[\"\\']([A-Za-z0-9/+=]{20,40})[\"\\']')
          suspicious = []
          for root, _, files in os.walk('.'):
              if '.git' in root or '.pytest_cache' in root or '__pycache__' in root:
                  continue
              for f in files:
                  if f.endswith(('.py', '.js', '.html', '.css', '.json', '.yml', '.yaml', '.md')):
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                              content = fp.read()
                              # Allow example placeholder strings
                              filtered = [m.group(0) for m in secret_pattern.finditer(content) if 'EXAMPLE' not in m.group(0).upper() and 'YOUR_' not in m.group(0).upper()]
                              if filtered:
                                  suspicious.append((p, filtered))
                      except Exception as e:
                          pass
          if suspicious:
              print('[ERROR] Potential secret exposed in files:', suspicious)
              exit(1)
          else:
              print('[PASS] No plaintext AWS secrets detected. Credentials hygiene verified.')
          "

  # ========================================================
  # STAGE 3: Container Build Verification (Amazon ECR / ECS Fargate Parity)
  # ========================================================
  docker-build-test:
    name: 🐳 Docker Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: [test-and-validate]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cost-optimizer-backend:latest
          load: true

      - name: 🚀 Test Container Run & Health Endpoint
        run: |
          echo "Starting container in background..."
          docker run -d --name test-container -p 8080:8080 cost-optimizer-backend:latest
          sleep 4
          docker ps
          echo "Checking /health endpoint inside container..."
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/health || (docker logs test-container && exit 1)
          echo "Container health check passed!"
          docker stop test-container

  # ========================================================
  # STAGE 4: Continuous Deployment (CD) - Deploy to AWS
  # ========================================================
  deploy-aws:
    name: 🚀 Continuous Deployment to AWS S3 & Lambda
    runs-on: ubuntu-latest
    needs: [test-and-validate, security-audit, docker-build-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_to_aws == true)

    env:
      AWS_REGION: ap-south-1
      S3_FRONTEND_BUCKET: cost-optimizer-frontend-226234259454
      LAMBDA_FUNCTION_NAME: cost-optimization-analyzer

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials from GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🌐 Deploy Frontend to S3 Static Website Bucket
        if: steps.aws_credentials.outcome == 'success'
        run: |
          echo "Syncing frontend files to s3://${S3_FRONTEND_BUCKET}..."
          aws s3 cp frontend/index.html s3://${S3_FRONTEND_BUCKET}/index.html --content-type "text/html" --cache-control "no-cache"
          aws s3 cp frontend/app.js s3://${S3_FRONTEND_BUCKET}/app.js --content-type "application/javascript" --cache-control "no-cache"
          aws s3 cp frontend/styles.css s3://${S3_FRONTEND_BUCKET}/styles.css --content-type "text/css" --cache-control "no-cache"
          aws s3 cp frontend/config.js s3://${S3_FRONTEND_BUCKET}/config.js --content-type "application/javascript" --cache-control "no-cache"
          echo "Frontend successfully updated on Amazon S3 website hosting."

      - name: ⚡ Deploy Backend Code to AWS Lambda
        if: steps.aws_credentials.outcome == 'success'
        run: |
          echo "Updating AWS Lambda function ${LAMBDA_FUNCTION_NAME}..."
          aws lambda update-function-code \
            --function-name ${LAMBDA_FUNCTION_NAME} \
            --zip-file fileb://backend/lambda_deployment_package.zip \
            --region ${AWS_REGION}
          echo "Lambda function code updated successfully."

      - name: ℹ️ Secrets Status Notification
        if: steps.aws_credentials.outcome != 'success'
        run: |
          echo "::notice ::AWS deployment step skipped or credentials not configured in GitHub Secrets. Add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_REGION to GitHub Repository Secrets to enable automated continuous cloud deployment."
